[project]
name = "instazap"
version = "0.1.0"
description = "Vídeos em partes de 60 segundos para uso pessoal"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "yt-dlp>=2026.3.3"]

[dependency-groups]
browser = ["playwright>=1.50"]
dev = ["pytest>=8.3", "httpx>=0.28", "pip-audit>=2.9", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
